[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Plausible analytics, proxied through this domain so the script and its events are
# first-party requests. The script path is this site's own Plausible script; if the
# snippet in the Plausible dashboard changes, update the pa- file name here.
[[redirects]]
  from = "/pulse/js/script.js"
  to = "https://plausible.io/js/pa-vjz0R3PYugwGSiVridiSf.js"
  status = 200

[[redirects]]
  from = "/pulse/api/event"
  to = "https://plausible.io/api/event"
  status = 200

[[redirects]]
  from = "/archive.html"
  to = "/issues/"
  status = 301

[[redirects]]
  from = "/apps/"
  to = "/explore/"
  status = 301

# The issue list moved from /archive/ to /issues/ on 2026-09-24, when the navigation
# renamed it Issues: every issue already lived at /issues/<date>/, so the list now sits at
# the address its label and its children imply.
[[redirects]]
  from = "/archive/"
  to = "/issues/"
  status = 301

[[redirects]]
  from = "/tags/"
  to = "/explore/"
  status = 301

[[redirects]]
  from = "/collections/"
  to = "/explore/"
  status = 301

[[redirects]]
  from = "/categories/"
  to = "/explore/"
  status = 301

[[redirects]]
  from = "/categories/focus/"
  to = "/categories/productivity-workflow/"
  status = 301

[[redirects]]
  from = "/categories/communicate/"
  to = "/categories/writing-notes-reading/"
  status = 301

[[redirects]]
  from = "/categories/design/"
  to = "/categories/files-research-documents/"
  status = 301

[[redirects]]
  from = "/categories/automate/"
  to = "/categories/productivity-workflow/"
  status = 301

[[redirects]]
  from = "/categories/organize/"
  to = "/categories/files-research-documents/"
  status = 301

[[redirects]]
  from = "/categories/code/"
  to = "/categories/developer-tools/"
  status = 301

[[redirects]]
  from = "/categories/thrive/"
  to = "/tags/health/"
  status = 301

[[redirects]]
  from = "/categories/tweak/"
  to = "/categories/mac-utilities-customization/"
  status = 301

# Retired tag routes (2026-09-01 tag audit). Point at the successor tag where one
# exists, otherwise at the sole app that carried the tag.
[[redirects]]
  from = "/tags/agent/"
  to = "/tags/agents/"
  status = 301

[[redirects]]
  from = "/tags/library/"
  to = "/tags/reading/"
  status = 301

[[redirects]]
  from = "/tags/ebooks/"
  to = "/tags/reading/"
  status = 301

[[redirects]]
  from = "/tags/documentation/"
  to = "/tags/capture/"
  status = 301

[[redirects]]
  from = "/tags/export/"
  to = "/apps/imessage-tui/"
  status = 301

[[redirects]]
  from = "/tags/cloud/"
  to = "/apps/duckdisk/"
  status = 301

[[redirects]]
  from = "/tags/icloud/"
  to = "/tags/rss/"
  status = 301

# Applied to every response. None of these change how the site renders; they are the
# baseline a static publication should send. HSTS is already set by Netlify, restated
# here with subdomains so the whole apex is covered.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# The JSON endpoints feed site search and the homepage rows. They are data, not pages,
# and Google was crawling the search index as one and reporting it as not indexed.
[[headers]]
  for = "/search-index.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/home-pools.json"
  [headers.values]
    X-Robots-Tag = "noindex"

[[redirects]]
  from = "/apps/filemaster/"
  to = "/categories/files-research-documents/"
  status = 301
